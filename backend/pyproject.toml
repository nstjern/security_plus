[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-plus-api"
version = "0.1.0"
description = "API for the Security+ study application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlmodel>=0.0.22,<0.1",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "pydantic-settings>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
    "pip-audit>=2.7,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "PT",   # pytest style
    "RUF",  # ruff-specific
    "S",    # bandit security checks
]
ignore = [
    "B008",  # FastAPI dependency injection relies on calls in argument defaults
]

[tool.ruff.lint.isort]
# The local alembic/ directory would otherwise shadow the installed package's name.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # assert is the point of a test
    "S105",  # test fixtures deliberately contain literal secrets
    "S106",
]
"alembic/versions/*" = ["E501"]       # generated revision identifiers run long

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
markers = [
    "integration: requires a live database",
]